data:
  n_features: 50
  anomaly_rate: 0.05

model:
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 19
    tree_method: hist
    device: cpu

  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 19
    verbose: -1

inference:
  quantisation: int8
  batch_size: 256
  max_latency_ms: 1.0

drift:
  detector: ks
  threshold: 0.05
  window_size: 1000
  retrain_trigger: true
